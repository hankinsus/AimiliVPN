<!doctype html> <html lang="zh-CN"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>AimiliVPN 客户端链路测试</title> <style>body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:24px}.wrap{max-width:820px;margin:auto}.card{background:#111827;border:1px solid #334155;border-radius:14px;padding:20px;margin:14px 0}h1{font-size:24px}button{background:#2563eb;color:#fff;border:0;border-radius:9px;padding:11px 18px;font-size:15px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{background:#0b1220;border-radius:10px;padding:14px}.v{font-size:24px;font-weight:700;margin-top:6px}.muted{color:#94a3b8;font-size:13px}.ok{color:#4ade80}.bad{color:#f87171}pre{white-space:pre-wrap;word-break:break-word;background:#020617;padding:12px;border-radius:8px}</style> </head> <body><div class="wrap"> <h1>客户端 → Ubuntu 链路测试</h1> <p class="muted">只测试当前浏览器到服务器的管理链路，以及服务器本地代理/VPN 状态。单次下载 1 MiB、上传 512 KiB。</p> <div class="card"><button id="run">开始测试</button><span id="status" class="muted"></span></div> <div class="grid"> <div class="metric"><div class="muted">HTTP RTT 中位数</div><div id="rtt" class="v">—</div></div> <div class="metric"><div class="muted">下载带宽</div><div id="down" class="v">—</div></div> <div class="metric"><div class="muted">上传带宽</div><div id="up" class="v">—</div></div> <div class="metric"><div class="muted">本机代理端口</div><div id="port" class="v">—</div></div> <div class="metric"><div class="muted">VPN 出口</div><div id="vpn" class="v">—</div></div> <div class="metric"><div class="muted">VPN 出口延时</div><div id="vlat" class="v">—</div></div> </div> <div class="card"><div class="muted">详细状态</div><pre id="detail">等待测试…</pre></div> </div> <script>const $=t=>document.getElementById(t);function median(t){const e=[...t].sort((t,e)=>t-e);return e.length%2?e[(e.length-1)/2]:(e[e.length/2-1]+e[e.length/2])/2}async function timedFetch(t,e){const n=performance.now(),o=await fetch(t,e),a=await o.arrayBuffer();return{r:o,data:a,ms:performance.now()-n}}async function run(){$("run").disabled=!0,$("status").textContent=" 测试中…";try{const t=[];let e=null;for(let n=0;n<5;n++){const n=performance.now(),o=await fetch("./api/link_probe?x="+Math.random(),{cache:"no-store"});e=await o.json(),t.push(performance.now()-n),await new Promise(t=>setTimeout(t,120))}$("rtt").textContent=median(t).toFixed(1)+" ms";const n=1048576,o=await timedFetch("./api/link_probe_payload?bytes="+n+"&x="+Math.random(),{cache:"no-store"});if(!o.r.ok)throw new Error("下载测速 HTTP "+o.r.status);$("down").textContent=(8*n/(o.ms/1e3)/1e6).toFixed(2)+" Mbps";const a=524288,r=new Uint8Array(a),s=performance.now(),c=await fetch("./api/link_probe_upload",{method:"POST",body:r,headers:{"Content-Type":"application/octet-stream"}}),i=await c.json(),p=performance.now()-s;if(!c.ok||!i.ok)throw new Error(i.error||"上传测速 HTTP "+c.status);$("up").textContent=(8*a/(p/1e3)/1e6).toFixed(2)+" Mbps";const l=!!e.proxy_port_reachable;$("port").textContent=l?"可达":"不可达",$("port").className="v "+(l?"ok":"bad"),$("vpn").textContent=e.proxy_ok?e.proxy_ip||"正常":"不可用",$("vpn").className="v "+(e.proxy_ok?"ok":"bad"),$("vlat").textContent=e.proxy_latency_ms?e.proxy_latency_ms+" ms":"—",$("detail").textContent=JSON.stringify(e,null,2),$("status").textContent=" 完成"}catch(t){$("status").textContent=" 失败: "+t.message}finally{$("run").disabled=!1}}$("run").onclick=run</script></body></html>
